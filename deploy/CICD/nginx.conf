# startup_hr runtime - unprivileged Nginx (nginxinc/nginx-unprivileged)
# Serves the immutable Flutter Web artifact. Runs as nginx (uid 101).
# Logs go to stdout/stderr so the container can run with a read-only rootfs.
#
# Cache policy:
#   * index.html, loaders (flutter.js / flutter_bootstrap.js), the service
#     worker and manifests must NEVER be cached as immutable - they are the
#     revalidation/update entry points.
#   * long-term immutable caching is reserved for content-hashed filenames.
#   * other static assets get a bounded, revalidatable cache.
# NOTE: a location that declares `add_header` stops inheriting the server-level
# headers, so the security headers are repeated in every caching location.

worker_processes auto;

error_log /dev/stderr notice;
pid       /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Writable temp paths live under /tmp (mounted as tmpfs in Compose).
    proxy_temp_path   /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path   /tmp/uwsgi_temp;
    scgi_temp_path    /tmp/scgi_temp;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /dev/stdout main;

    sendfile        on;
    keepalive_timeout 65;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;

    server {
        listen       8080;
        listen  [::]:8080;
        server_name  localhost;

        root  /usr/share/nginx/html;
        index index.html;

        # ---------- basic security headers ----------
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

        # ---------- health check endpoint (returns HTTP 200) ----------
        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        # ---------- app entry point: never immutable-cached ----------
        location = /index.html {
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
            add_header Cache-Control "no-cache, must-revalidate" always;
            try_files $uri =404;
        }

        # ---------- loaders / service worker / manifests: never immutable ----------
        location ~* '^/(flutter\.js|flutter_bootstrap\.js|flutter_service_worker\.js|main\.dart\.js|manifest\.json|version\.json)$' {
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
            add_header Cache-Control "no-cache, must-revalidate" always;
            try_files $uri =404;
        }

        # ---------- long-term immutable cache: content-hashed assets only ----------
        location ~* '[.-][a-f0-9]{8,64}\.(?:css|js|json|png|jpe?g|gif|svg|ico|woff2?|wasm)$' {
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # ---------- other static assets (not content-hashed): bounded, revalidatable ----------
        location ~* '\.(?:css|js|json|png|jpe?g|gif|svg|ico|woff2?|wasm|otf|bin|frag)$' {
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
            add_header Cache-Control "public, max-age=3600, must-revalidate" always;
            try_files $uri =404;
        }

        # ---------- Flutter client-side routing: fall back to index.html ----------
        # (internal redirect to /index.html re-enters the exact no-cache location)
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}